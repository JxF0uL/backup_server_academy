version: '3.8'

services:
  web:
    build:
      context: .
    volumes:
      - .:/app
      - static_volume:/app/static
    expose:
      - "8000"
    environment:
      - DEBUG=False

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  static_volume:
