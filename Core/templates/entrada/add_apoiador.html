{% extends 'bases/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Adicionar Apoiador</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_nome_completo">Nome Completo</label>
            <input type="text" class="form-control" id="id_nome_completo" name="nome_completo" required>
        </div>
        <div class="form-group">
            <label for="id_cnpj">CNPJ</label>
            <input type="text" class="form-control" id="id_cnpj" name="cnpj" required>
        </div>
        <div class="form-group">
            <label for="id_email">Email</label>
            <input type="email" class="form-control" id="id_email" name="email" required>
        </div>
        <div class="form-group">
            <label for="id_telefone">Telefone</label>
            <input type="text" class="form-control" id="id_telefone" name="telefone" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Salvar</button>
    </form>
</div>
{% endblock %}
